<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoMarques — Lançamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap" style="max-width:900px;">

  <header class="masthead" style="border-bottom:2px solid var(--ink);">
    <div>
      <img src="assets/logo-mark.png" alt="" style="height:40px;margin-bottom:10px;">
      <p class="eyebrow">Consultoria CoMarques</p>
      <h1>Lançamentos</h1>
      <p class="sub">Acesso restrito — só esta aba, nada do resto do painel.</p>
    </div>
  </header>

  <div id="conteudo">
    <div class="estado" style="max-width:360px;margin:0 auto;text-align:left;">
      <h2 style="text-align:center;">Entrar</h2>
      <div style="margin-top:20px;">
        <input type="text" id="input-chave" placeholder="Chave de acesso">
        <button id="btn-entrar" style="width:100%;margin-top:10px;">Entrar</button>
        <p class="mensagem" id="msg-login"></p>
      </div>
    </div>
  </div>

</div>

<script src="js/config.js"></script>
<script src="js/gas.js"></script>
<script src="js/lancamentos.js"></script>
</body>
</html>
